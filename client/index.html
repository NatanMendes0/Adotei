<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-light.png" id="favicon" />
    <link rel="shortcut icon" type="image/png" href="/favicon-light.png" />
    <link rel="apple-touch-icon" href="/favicon-light.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Adotei - Conectando pets a lares amorosos"
    />
    <title>Adotei - Conectando pets a lares amorosos</title>
    <script>
      // Função para atualizar o favicon baseado no tema
      function updateFavicon() {
        const isDarkMode = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;
        const favicon = document.getElementById("favicon");
        const newFavicon = isDarkMode
          ? "/favicon-light.png"
          : "/favicon-dark.png";

        if (favicon.href !== newFavicon) {
          favicon.href = newFavicon;
          document.querySelector('link[rel="shortcut icon"]').href = newFavicon;
          document.querySelector('link[rel="apple-touch-icon"]').href =
            newFavicon;
        }
      }

      // Atualiza o favicon quando a página carrega
      updateFavicon();

      // Atualiza o favicon quando o tema muda
      window
        .matchMedia("(prefers-color-scheme: dark)")
        .addEventListener("change", updateFavicon);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
